<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Ashish Kumar Singh</title>
  <meta name="robots" content="noindex">
  <link rel="shortcut icon" href="./assets/images/my-avatar.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: hsl(240, 2%, 12%);
      font-family: "Poppins", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    .card {
      background: hsl(240, 2%, 13%);
      border: 1px solid hsl(0, 0%, 22%);
      border-radius: 20px;
      padding: 60px 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: -4px 8px 24px hsla(0, 0%, 0%, 0.25);
    }

    .code {
      font-size: 72px;
      font-weight: 600;
      background: linear-gradient(to right, hsl(45, 100%, 72%), hsl(36, 100%, 68%));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 10px;
    }

    h1 {
      color: hsl(0, 0%, 95%);
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    p {
      color: hsl(0, 0%, 84%);
      font-size: 14px;
      font-weight: 300;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      background: linear-gradient(to bottom right, hsl(45, 100%, 72%), hsl(36, 100%, 68%));
      color: hsl(240, 1%, 17%);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 10px;
      transition: transform 0.25s ease;
    }

    .btn:hover { transform: scale(1.05); }
  </style>
</head>
<body>

  <div class="card">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or was moved. Head back to the portfolio.</p>
    <a href="/" class="btn">Back to Home</a>
  </div>

</body>
</html>
